<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên - Portal</title>
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #4338ca;
            --primary-hover: #3730a3;
            --primary-light: #eef2ff;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --border-subtle: #e2e8f0;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.05);
            --radius-lg: 14px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-body);
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        /* App Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: -0.02em;
        }
        .header-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Toast thông báo */
        #message {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            display: none;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            animation: slideIn 0.25s ease-out;
        }
        #message.ok {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        #message.error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        @keyframes slideIn {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Grid chia layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 980px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Thẻ Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form bên trái */
        form.student-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-title);
        }

        form.student-form input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            outline: none;
            background: #fcfcfd;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        form.student-form input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        button.primary {
            background: var(--primary);
            color: #fff;
            flex: 1;
        }
        button.primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 10px rgba(67, 56, 202, 0.25);
        }

        button.secondary {
            background: #f1f5f9;
            color: var(--text-body);
            border: 1px solid var(--border-subtle);
        }
        button.secondary:hover {
            background: #e2e8f0;
        }

        /* Thanh tìm kiếm */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box {
            position: relative;
            flex: 1;
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }
        .toolbar input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            font-size: 14px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            outline: none;
            background: #fcfcfd;
            font-family: inherit;
            transition: all 0.15s ease;
        }
        .toolbar input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        /* Bảng dữ liệu */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #fafbfc;
        }

        .student-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .badge-code {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border-subtle);
        }

        .badge-class {
            background: #eff6ff;
            color: #2563eb;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        td.actions {
            display: flex;
            gap: 6px;
        }

        button.action-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 8px;
            background: #fff;
            border: 1px solid var(--border-subtle);
        }
        button.action-btn.edit {
            color: #d97706;
        }
        button.action-btn.edit:hover {
            background: #fef3c7;
            border-color: #fde68a;
        }
        button.action-btn.danger {
            color: #dc2626;
        }
        button.action-btn.danger:hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .empty-row td {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-title">
            <div class="header-logo"><i class="bi bi-mortarboard-fill"></i></div>
            <div>
                <h1>Quản lý sinh viên</h1>
                <div class="header-desc">Hệ thống theo dõi và cập nhật hồ sơ sinh viên</div>
            </div>
        </div>
    </header>

    <!-- Toast message -->
    <div id="message"></div>

    <div class="dashboard-grid">
        <!-- Cột trái: Form nhập -->
        <div class="card">
            <div class="card-title">
                <i class="bi bi-person-lines-fill text-primary"></i>
                <span id="formTitle">Thêm sinh viên</span>
            </div>
            <form class="student-form" id="studentForm" onsubmit="return submitForm(event)">
                <input type="hidden" id="studentId">
                
                <div class="form-group">
                    <label>Mã sinh viên *</label>
                    <input type="text" id="studentCode" placeholder="VD: SV001" required>
                </div>

                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" id="fullName" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="phone" placeholder="0987 654 321">
                </div>

                <div class="form-group">
                    <label>Lớp học</label>
                    <input type="text" id="className" placeholder="VD: IT24M">
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary" id="submitBtn">
                        <i class="bi bi-check2-circle"></i> Thêm sinh viên
                    </button>
                    <button type="button" class="secondary" onclick="resetForm()">Hủy</button>
                </div>
            </form>
        </div>

        <!-- Cột phải: Tìm kiếm & Bảng danh sách -->
        <div class="card">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="keyword" placeholder="Tìm theo mã SV, họ tên, email, số điện thoại...">
                </div>
                <button class="primary" style="flex: 0 0 auto;" onclick="loadStudents()">
                    Tìm kiếm
                </button>
                <button class="secondary" onclick="clearSearch()" title="Đặt lại">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

            <!-- Bảng -->
            <div class="table-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th>Mã SV</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Lớp</th>
                        <th style="text-align: right; padding-right: 20px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/students';

    document.addEventListener('DOMContentLoaded', loadStudents);

    function showMessage(text, isError) {
        const el = document.getElementById('message');
        const icon = isError ? '<i class="bi bi-exclamation-triangle-fill"></i>' : '<i class="bi bi-check-circle-fill"></i>';
        el.innerHTML = `${icon} ${text}`;
        el.className = isError ? 'error' : 'ok';
        if (text) {
            setTimeout(() => { el.textContent = ''; el.className = ''; }, 3500);
        }
    }

    function clearSearch() {
        document.getElementById('keyword').value = '';
        loadStudents();
    }

    async function loadStudents() {
        const keyword = document.getElementById('keyword').value.trim();
        const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Không tải được danh sách sinh viên');
            const students = await res.json();
            renderTable(students);
        } catch (err) {
            showMessage(err.message, true);
        }
    }

    function renderTable(students) {
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        if (!students || students.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="6"><i class="bi bi-inbox" style="font-size: 28px; display:block; margin-bottom: 6px; opacity: 0.5;"></i>Không có sinh viên nào</td></tr>';
            return;
        }

        students.forEach(s => {
            const initial = s.fullName ? s.fullName.trim().charAt(0).toUpperCase() : 'S';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge-code">${escapeHtml(s.studentCode)}</span></td>
                <td>
                    <div class="student-cell">
                        <div class="avatar">${initial}</div>
                        <strong>${escapeHtml(s.fullName)}</strong>
                    </div>
                </td>
                <td style="color: var(--text-muted);">${escapeHtml(s.email)}</td>
                <td style="color: var(--text-muted);">${escapeHtml(s.phone || '-')}</td>
                <td>${s.className ? `<span class="badge-class">${escapeHtml(s.className)}</span>` : '-'}</td>
                <td class="actions" style="justify-content: flex-end;">
                    <button class="action-btn edit" title="Chỉnh sửa" onclick='editStudent(${JSON.stringify(s)})'>
                        <i class="bi bi-pencil-fill"></i>
                    </button>
                    <button class="action-btn danger" title="Xóa" onclick="deleteStudent('${s.id}')">
                        <i class="bi bi-trash3-fill"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value ?? '';
        return div.innerHTML;
    }

    function editStudent(student) {
        document.getElementById('studentId').value = student.id;
        document.getElementById('studentCode').value = student.studentCode || '';
        document.getElementById('fullName').value = student.fullName || '';
        document.getElementById('email').value = student.email || '';
        document.getElementById('phone').value = student.phone || '';
        document.getElementById('className').value = student.className || '';

        document.getElementById('formTitle').textContent = 'Cập nhật sinh viên';
        document.getElementById('submitBtn').innerHTML = '<i class="bi bi-arrow-repeat"></i> Cập nhật';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('formTitle').textContent = 'Thêm sinh viên';
        document.getElementById('submitBtn').innerHTML = '<i class="bi bi-check2-circle"></i> Thêm sinh viên';
    }

    async function submitForm(event) {
        event.preventDefault();

        const id = document.getElementById('studentId').value;
        const payload = {
            studentCode: document.getElementById('studentCode').value.trim(),
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            className: document.getElementById('className').value.trim()
        };

        try {
            let res;
            if (id) {
                res = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            if (!res.ok) throw new Error('Lưu sinh viên thất bại');

            showMessage(id ? 'Cập nhật sinh viên thành công!' : 'Thêm sinh viên thành công!', false);
            resetForm();
            loadStudents();
        } catch (err) {
            showMessage(err.message, true);
        }

        return false;
    }

    async function deleteStudent(id) {
        if (!confirm('Bạn có chắc muốn xóa sinh viên này?')) return;
        try {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Xóa sinh viên thất bại');
            showMessage('Đã xóa sinh viên thành công!', false);
            loadStudents();
        } catch (err) {
            showMessage(err.message, true);
        }
    }
</script>
</body>
</html>
